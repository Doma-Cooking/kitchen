name: "Feature Request"
description: "Propose a new feature for AI-powered planning"
labels: ["feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: "Problem / Motivation"
      description: "What problem does this solve or what opportunity does it address?"
      placeholder: "Describe the problem or opportunity..."
    validations:
      required: true

  - type: textarea
    id: desired-outcome
    attributes:
      label: "Desired Outcome"
      description: "What should the end result look like? Describe the user-facing or system-level behavior."
      placeholder: "Describe the expected outcome..."
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: "Constraints"
      description: "Scope boundaries, backward compatibility, performance requirements, etc."
      placeholder: "Any constraints to be aware of..."
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: "Priority"
      options:
        - Critical
        - High
        - Medium
        - Low
    validations:
      required: true

  - type: dropdown
    id: estimated-size
    attributes:
      label: "Estimated Size"
      options:
        - "Small (hours)"
        - "Medium (days)"
        - "Large (week+)"
    validations:
      required: true

  - type: textarea
    id: technical-context
    attributes:
      label: "Technical Context"
      description: "Relevant files, systems, APIs, or dependencies the agent should be aware of."
      placeholder: "Point toward relevant code, systems, or APIs..."
    validations:
      required: false

  - type: textarea
    id: additional-notes
    attributes:
      label: "Additional Notes"
      description: "Anything else - links, screenshots, prior art, constraints."
      placeholder: "Any additional context..."
    validations:
      required: false
