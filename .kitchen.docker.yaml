# Docker-specific configuration for Kitchen server.
# Overrides service hostnames to match docker-compose service names.

port: 3000

redis:
  host: redis
  port: 6379

db:
  host: postgres
  port: 5432
  user: kitchen
  name: kitchen

queue:
  name: kitchenQueue

github:
  appSlug: kitchen-cook
  columns:
    planning: Planning
    implementing: In Progress
    ready: Ready
  label: "agent:enabled"

repo:
  url: https://github.com/Doma-Cooking/doma-main
  clonePath: /tmp/repo
  mainBranch: dev

slack:
  channelId: C0AD27ZRNE4

flutter:
  channel: stable
  home: /opt/flutter
