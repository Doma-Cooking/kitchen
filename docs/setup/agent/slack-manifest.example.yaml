# Slack App Manifest — paste this into api.slack.com/apps → Create New App → From a manifest
#
# After creating the app:
#   1. Copy the App-Level Token (xapp-) from Socket Mode settings
#   2. Install to your workspace and copy the Bot Token (xoxb-) from OAuth & Permissions
#   3. Copy the User Token (xoxp-) from OAuth & Permissions (needed for search)
#   4. Add all tokens to your .env file

display_information:
  name: Agent
  description: Kitchen AI agent

features:
  bot_user:
    display_name: Agent
    always_online: true

oauth_config:
  scopes:
    bot:
      - chat:write
      - app_mentions:read
      - channels:read
      - channels:history
      - channels:manage
      - groups:read
      - groups:history
      - groups:write.topic
      - im:history
      - mpim:history
      - reactions:write
      - users:read
      - files:write
    user:
      - search:read

settings:
  socket_mode_enabled: true
  org_deploy_enabled: false
  event_subscriptions:
    bot_events:
      - message.im
      - app_mention
