services:
  app:
    build: .
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file: .env
    volumes:
      - ./.kitchen.yaml:/app/.kitchen.yaml:ro
      - claude-data:${CLAUDE_CONFIG_DIR:-/data/claude}
      - workspace-data:${WORKSPACES_PATH:-/data/workspaces}
      - snapshot-data:${SNAPSHOTS_PATH:-/data/snapshots}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:17-alpine
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kitchen}
      POSTGRES_USER: ${POSTGRES_USER:-kitchen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kitchen}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kitchen}"]
      interval: 2s
      timeout: 5s
      retries: 5

volumes:
  claude-data:
  workspace-data:
  snapshot-data:
