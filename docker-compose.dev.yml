services:
  kitchen-server:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    volumes:
      - ./src:/app/src:ro
      - ./scripts:/app/scripts:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      - ./.kitchen.yaml:/app/.kitchen.yaml:ro
    environment:
      - NODE_ENV=development
