services:
  kitchen-server:
    build:
      context: ./kitchen_server
      target: development
    volumes:
      - ./kitchen_server/src:/server/src:ro
      - ./kitchen_server/tsconfig.json:/server/tsconfig.json:ro
    environment:
      - NODE_ENV=development

  kitchen-dashboard:
    build:
      context: ./kitchen_dashboard
      target: development
    volumes:
      - ./kitchen_dashboard/src:/dashboard/src:ro
      - ./kitchen_dashboard/tsconfig.json:/dashboard/tsconfig.json:ro
    environment:
      - NODE_ENV=development
