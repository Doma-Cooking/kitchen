services:
  kitchen-server:
    build:
      context: .
      dockerfile: kitchen_server/Dockerfile
      target: development
      args:
        FLUTTER_CHANNEL: ${FLUTTER_CHANNEL:-stable}
        FLUTTER_HOME: ${FLUTTER_HOME:-/opt/flutter}
    volumes:
      - ./kitchen_server/src:/server/kitchen_server/src:ro
      - ./kitchen_server/tsconfig.json:/server/kitchen_server/tsconfig.json:ro
      - ./kitchen_database/dist:/server/kitchen_database/dist:ro
      - ./kitchen_station/dist:/server/kitchen_station/dist:ro
      - ./kitchen_cookbook/dist:/server/kitchen_cookbook/dist:ro
    environment:
      - NODE_ENV=development

  kitchen-dashboard:
    build:
      context: ./kitchen_dashboard
      target: development
    volumes:
      - ./kitchen_dashboard/src:/dashboard/src:ro
      - ./kitchen_dashboard/tsconfig.json:/dashboard/tsconfig.json:ro
    environment:
      - NODE_ENV=development
