port: 3000
workers: 4
maxTurns: 500
redis:
  url: redis://redis:6379
postgres:
  url: postgres://kitchen:kitchen@postgres:5432/kitchen
plugins:
  path: /data/plugins/my-kitchen
  git:
    url: https://github.com/my-org/my-kitchen
    branch: main  # optional, defaults to main
company:
  name: My Company
  description: a short description of what the company does
repositories:
  - name: example
    url: https://github.com/example/example-repo
    description: Example repository
    defaultBranch: main
docs:
  owner: example-org
  repo: example-docs
  branch: main
agents:
  defaultAgent: agent
  team:
    agent:
      displayName: "Agent"
      agentPrompt: agents/agents/agent.md
      pluginPaths:
        - shared
        - domains/my-domain
      slack:
        appTokenEnv: AGENT_SLACK_APP_TOKEN
        botTokenEnv: AGENT_SLACK_BOT_TOKEN
        userTokenEnv: AGENT_SLACK_USER_TOKEN
      github:
        tokenEnv: AGENT_GITHUB_TOKEN
      linear:
        clientIdEnv: AGENT_LINEAR_CLIENT_ID
        clientSecretEnv: AGENT_LINEAR_CLIENT_SECRET
      # Cron schedules — all times are UTC
      # Each entry fires a /${skill} event at the specified cron expression
      schedules:
        - cron: "0 9 * * 1-5"   # 9am UTC Mon–Fri
          skill: my-skill
          name: my-schedule
