port: 3000
workers: 4
maxTurns: 500
redis:
  url: redis://redis:6379
postgres:
  url: postgres://kitchen:kitchen@postgres:5432/kitchen
plugins:
  path: /app/src/plugins
repositories:
  - name: example
    url: https://github.com/example/example-repo
    description: Example repository
    defaultBranch: main
agents:
  basePrompt: agents/agents/base.md
  defaultAgent: toph
  team:
    toph:
      displayName: "Toph"
      agentPrompt: agents/agents/toph.md
      pluginPaths:
        - shared
        - domains/operations
      slack:
        appTokenEnv: TOPH_SLACK_APP_TOKEN
        botTokenEnv: TOPH_SLACK_BOT_TOKEN
        userTokenEnv: TOPH_SLACK_USER_TOKEN
      github:
        tokenEnv: TOPH_GITHUB_TOKEN
      linear:
        clientIdEnv: TOPH_LINEAR_CLIENT_ID
        clientSecretEnv: TOPH_LINEAR_CLIENT_SECRET
      notion:
        tokenEnv: TOPH_NOTION_TOKEN
