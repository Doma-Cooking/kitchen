port: 3000
workers: 4
redis:
  url: redis://redis:6379
plugins:
  path: /plugins
agents:
  defaultAgent: toph
  team:
    toph:
      displayName: "Toph"
      agentPrompt: agents/toph/agents/toph.md
      pluginPaths:
        - shared
        - domains/operations
      slack:
        appTokenEnv: SLACK_TOPH_APP_TOKEN
        botTokenEnv: SLACK_TOPH_BOT_TOKEN
