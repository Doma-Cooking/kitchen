port: 3000
workers: 4
maxTurns: 500
redis:
  url: redis://redis:6379
postgres:
  url: postgres://kitchen:kitchen@postgres:5432/kitchen
plugins:
  path: /app/dist/plugins
repositories:
  - name: example
    url: https://github.com/example/example-repo
    description: Example repository
    defaultBranch: main
docs:
  owner: example-org
  repo: example-docs
  branch: main
agents:
  basePrompt: agents/agents/base.md
  defaultAgent: my-agent  # name of the agent to use when no other routing applies
  team:
    my-agent:  # replace with your agent's name (lowercase, matches env var prefix in uppercase)
      displayName: "My Agent"
      agentPrompt: agents/agents/my-agent.md  # path to your agent's prompt file
      pluginPaths:
        - shared
        - domains/my-domain  # optional: domain plugin for this agent
      slack:
        appTokenEnv: MY_AGENT_SLACK_APP_TOKEN
        botTokenEnv: MY_AGENT_SLACK_BOT_TOKEN
        userTokenEnv: MY_AGENT_SLACK_USER_TOKEN
      github:
        tokenEnv: MY_AGENT_GITHUB_TOKEN
      linear:
        clientIdEnv: MY_AGENT_LINEAR_CLIENT_ID
        clientSecretEnv: MY_AGENT_LINEAR_CLIENT_SECRET
      # Cron schedules — all times are UTC
      # Each entry fires a /${skill} event at the specified cron expression
      schedules:
        - cron: "0 9 * * 1-5"   # 9am UTC Mon–Fri
          skill: my-skill
          name: my-schedule
