port: 3000
workers: 4
maxTurns: 500
redis:
  url: redis://redis:6379
postgres:
  url: postgres://kitchen:kitchen@postgres:5432/kitchen
plugins:
  path: /app/dist/plugins
repositories:
  - name: example
    url: https://github.com/example/example-repo
    description: Example repository
    defaultBranch: main
docs:
  owner: example-org
  repo: example-docs
  branch: main
agents:
  basePrompt: agents/agents/base.md
  defaultAgent: toph
  team:
    toph:
      displayName: "Toph"
      agentPrompt: agents/agents/toph.md
      pluginPaths:
        - shared
        - domains/operations
      slack:
        appTokenEnv: TOPH_SLACK_APP_TOKEN
        botTokenEnv: TOPH_SLACK_BOT_TOKEN
        userTokenEnv: TOPH_SLACK_USER_TOKEN
      github:
        tokenEnv: TOPH_GITHUB_TOKEN
      linear:
        clientIdEnv: TOPH_LINEAR_CLIENT_ID
        clientSecretEnv: TOPH_LINEAR_CLIENT_SECRET
      # Cron schedules — all times are UTC
      # Each entry fires a /${skill} event at the specified cron expression
      schedules:
        - cron: "0 9 * * 1-5"   # 9am UTC Mon–Fri
          skill: daily-standup
          name: morning-standup
        - cron: "0 17 * * 5"    # 5pm UTC Friday
          skill: weekly-digest
          name: friday-digest
          stationId: toph-weekly  # optional: use a dedicated station
