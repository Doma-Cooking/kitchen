agent:
  provider: claude-code
  model: claude-opus-4-5
  timeout_minutes: 30

interaction:
  trigger: "@agent"

columns:
  todo: "To Do"
  planning: "Planning"
  ready: "Ready for Dev"
  implementing: "Implementing"
  done: "Done"

labels:
  enabled: "agent:enabled"
  needs_input: "agent:needs-input"

templates:
  branch: default
  commit: default
  pr_title: default
  plan: default
  sub_issue: default
  questions: default
  pr_body: default

prompts:
  planning:
    prompt: default
    allowed_tools:
      # Claude Code tools
      - Read
      - Glob
      - Grep
      - WebFetch
      - WebSearch
      # Platform tools (read)
      - get_issue
      - get_comments
      - get_linked_issues
      # Platform tools (write)
      - post_comment
      - create_issue
      - link_issues
      - add_label
      - remove_label
  implementation:
    prompt: default
    allowed_tools:
      # Claude Code tools
      - Read
      - Glob
      - Grep
      - Write
      - Edit
      - Bash
      - WebFetch
      - WebSearch
      # Platform tools (read)
      - get_issue
      - get_comments
      - get_linked_issues
      - get_pull_request
      - get_reviews
      - get_review_comments
      # Platform tools (write)
      - post_comment
      - create_pull_request
      - update_pull_request
      - add_label
      - remove_label

notifications:
  slack:
    enabled: false
    webhook_url: ${SLACK_WEBHOOK_URL}
    events: [agent_started, plan_ready, pr_ready, questions_asked, session_failed]
